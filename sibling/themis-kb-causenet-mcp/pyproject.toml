[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "themis-kb-causenet-mcp"
version = "0.1.0-dev"
description = "MCP server exposing CauseNet (Heindorf et al. 2020) for Themis causal-edge verification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Crows12138", email = "ucapxux@ucl.ac.uk" },
]
keywords = ["causal-inference", "knowledge-graph", "mcp", "themis", "causenet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.optional-dependencies]
build = []  # standard library bz2 + sqlite3 cover Phase A/B
dev = [
    "pytest>=8",
]

[project.scripts]
themis-causenet-mcp = "causenet_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"causenet_mcp" = ["py.typed"]
