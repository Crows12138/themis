[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "themis-causal"
version = "0.1.4"
description = "Causal-reasoning backbone for LLM agents — no fabricated effect sizes, structured audit trail, GapKind diagnostics"
readme = "README.en.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Crows12138", email = "ucapxux@ucl.ac.uk" },
]
keywords = [
    "causal-inference",
    "llm",
    "agent",
    "mcp",
    "do-calculus",
    "data-gap-diagnosis",
    "audit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Core runtime deps used by themis/{kernel,runtime,verifier,output,
# input,workflow,estimation,mcp}. Non-core subpackages (web, oracle,
# discovery) declare their needs as extras below — default install
# stays lean.
dependencies = [
    "mcp>=1.0",
    "pydantic>=2.0",
    "jsonschema>=4.0",
    "referencing>=0.30",
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
# Local FastAPI UI (themis/web/) — deprecated chat-user path, kept
# as a demo; not on the LLM-agent-backbone critical path.
web = ["fastapi>=0.110", "uvicorn>=0.27"]
# pgmpy parity adapter (themis/oracle/) — dev-only QA, used to cross-
# check Themis identification against an established library.
oracle = ["pgmpy>=0.1.24"]
# Causal-discovery from CSV (themis/estimation/discovery.py wraps
# causal-learn algorithms PC / FCI / LiNGAM).
discovery = ["causal-learn>=0.1.4"]
# Test runner + extras for CI / contributors.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Not a linter here. The vocabulary tables (themis/{refusals,blocks,
    # answers,questions,routing}.py and output/formula_text.py) each name a
    # closed set that some surface must cover, and ``bind`` checks the half
    # a dict can check — that its keys are exactly the set. The other half
    # is a claim about branches, and ``typing.assert_never`` is what states
    # it. Without a checker that reads it, the statement is a comment.
    "mypy>=1.11",
]

[project.scripts]
# Console entry point for the MCP server. After `pip install themis-causal`,
# users can invoke `themis-mcp` directly instead of `python -m themis.mcp.server`.
themis-mcp = "themis.mcp.server:main"

[project.urls]
Homepage = "https://github.com/Crows12138/themis"
Repository = "https://github.com/Crows12138/themis"
Issues = "https://github.com/Crows12138/themis/issues"

[tool.mypy]
# The package, minus a named list of modules whose findings are still
# suppressed. It began the other way round — a list of what had been read
# and cleaned — and that shape hid its own drift: sixty-two modules were
# already clean and simply nobody had added them, so the gate protected a
# fraction of what it appeared to. A whitelist is silent about what it
# leaves out, and the thing being guarded is exactly what nobody thought
# to name.
#
# Inverted, the list below is a debt that can only shrink, a new module is
# checked the day it is written, and cleaning one means deleting a line.
#
# It paid for itself twice. ``except EstimatorFailure`` in dispatch's
# doubly-robust path named an import twenty-four sibling handlers each
# made for themselves and that one forgot — and an ``except`` clause
# evaluates its name only when it fires, so every refusal from AIPW / IPW
# / TMLE came back as NameError. And a helper in the data-gap report read
# ``step.context`` off a ``DerivationStep``, which has no such field, then
# looked for keys no step has ever written: two independent mistakes in
# four lines, alive because every dose-response program in the corpus has
# an empty derivation, and raising AttributeError out of ``themis.run``
# for the first one that does not.
python_version = "3.11"
files = ["themis"]
# Imports are followed for their types and silent about their own errors,
# so a checked module is checked against the real signatures of a
# suppressed one without inheriting its findings.
follow_imports = "silent"
ignore_missing_imports = true
# An ignore that has stopped being needed is a claim that has stopped
# being true.
warn_unused_ignores = true

# One module, and it is no longer "not yet read" — that was what this list
# meant when it held fifty-eight. It has been read, and what remains is a
# cost rather than a backlog.
#
# ``themis.runtime.c_factor`` stamps ``_IdState.x_value`` into
# ``ValuedAtom.value``, and that field holds either a concrete do-literal or
# ``_IDC_VALUE_SENTINEL``, an unforgeable marker for a slot whose literal is
# stamped later. The formula AST has three value states — a literal, a
# ``VarRef`` bound by an enclosing sum, and ``None`` bound by the query — and
# the identification recursion needs a fourth. There is no member of
# ``ValueExpr`` it can honestly borrow: making the sentinel a ``VarRef``
# changes what ``formula_simplify`` collects while the formula is still
# un-stamped, making it a literal forfeits the unforgeability that
# ``_apply_idc_values`` says is load-bearing, and ``None`` already means the
# query-bound hole. Closing it is a decision about where that fourth state
# lives, not an annotation (see the frontier item), so the line stays and
# says why.
[[tool.mypy.overrides]]
module = [
    "themis.runtime.c_factor",
]
ignore_errors = true

[tool.setuptools.packages.find]
where = ["."]
include = ["themis*"]
exclude = ["tests*", "docs*", "benchmarks*", "scripts*"]

# Ship the JSON schemas (themis/schemas/) and prompt markdown +
# examples (themis/prompts/) inside the wheel. Without this, installed
# users hit FileNotFoundError when themis.input.syntactic_validator
# tries to load kernel_ast.schema.json or themis.mcp.server tries to
# resolve a themis://prompts/X.md resource URI.
[tool.setuptools.package-data]
themis = [
    "schemas/*.json",
    "prompts/*.md",
    "prompts/examples/*.json",
    "claude_skills/*/SKILL.md",
]
