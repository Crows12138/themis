name: Publish to PyPI

# Trigger on any version tag push. Two tag conventions:
#   v0.1.2-test  → uploads to TestPyPI (sandbox; freely bump-able)
#   v0.1.2       → uploads to real PyPI (locked once published)
#
# Workflow does NOT run on regular pushes — only tags. This keeps the
# "release" action explicit: bumping pyproject.toml version + pushing
# a matching tag is the entire publish command.
on:
  push:
    tags:
      - 'v*'

# Required repo secrets (Settings → Secrets and variables → Actions):
#   TEST_PYPI_API_TOKEN  — pypi-AgEI... from https://test.pypi.org/manage/account/token/
#   PYPI_API_TOKEN       — pypi-AgEI... from https://pypi.org/manage/account/token/
#
# After secrets are configured, the only release command is:
#   git tag v0.1.2-test  &&  git push origin v0.1.2-test   # TestPyPI smoke
#   git tag v0.1.2       &&  git push origin v0.1.2        # real PyPI

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Publish to TestPyPI
        if: endsWith(github.ref, '-test')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: twine upload --repository-url https://test.pypi.org/legacy/ dist/*

      - name: Publish to PyPI
        if: ${{ !endsWith(github.ref, '-test') }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
