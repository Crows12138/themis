[pytest]
# Explicit test discovery root. Without this, pytest crawls the entire
# repo on collect — slower and surfaces stray test_*.py in scripts/
# or docs/ that aren't real tests.
testpaths = tests

# Lock in current implicit default (function scope) to silence
# pytest-asyncio deprecation warning about scope being unset.
# Future pytest-asyncio versions will change this default; explicit
# declaration here pins our behavior.
asyncio_default_fixture_loop_scope = function

filterwarnings =
    ignore:`pgmpy.estimators.StructureScore` is deprecated.*:FutureWarning:pgmpy.estimators
    ignore:.*`disp` and `iprint` options of the L-BFGS-B solver are deprecated.*:DeprecationWarning:sklearn\.linear_model\._logistic
    ignore:Perfect separation or prediction detected.*:Warning:statsmodels\.discrete\.discrete_model
    ignore:divide by zero encountered in log:RuntimeWarning:statsmodels\.discrete\.discrete_model
    ignore:overflow encountered in exp:RuntimeWarning:statsmodels\.discrete\.discrete_model
    ignore:Co-variance matrix is underdetermined\. Inference will be invalid!:UserWarning:econml\.sklearn_extensions\.linear_model
    ignore:.*variables are assumed unobserved because they are not in the dataset.*:UserWarning:dowhy\.causal_model
    ignore:Conversion of an array with ndim > 0 to a scalar is deprecated.*:DeprecationWarning:causallearn\.score\.LocalScoreFunction
